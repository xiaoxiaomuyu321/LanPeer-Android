pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def mirror = providers.gradleProperty('googleMirror').orNull
        if (mirror) { maven { url = uri(mirror) } }
        google(); mavenCentral()
    }
}
rootProject.name = 'LanPeer'
include ':app'
